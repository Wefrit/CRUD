<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>

  <body>
    <!-- Navbar com título-->
    <nav class="navbar mb-4" style="background-color: #406077ff;" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><h1> Adicionar Tarefa</h1>
            </a>
        </div>
    </nav>

    <!-- Página de tarefas -->
    <main class="container">
        <h2>Nova Tarefa</h2>
        <form method="post" action="">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                &emsp;&emsp;&emsp;&emsp;&ensp;{{ form.title }}
            </div>
            <div class="mb-3">
                <label for="deadline" class="form-label">Data de Entrega</label>
                {{ form.deadline }}
            </div>
            <button type="submit" class="btn btn-dark">Salvar</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>

  
</html>
